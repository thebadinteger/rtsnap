name: test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        go: [ '1.22.x', '1.23.x' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test Pure Go (CGO disabled)
        env:
          CGO_ENABLED: 0
        run: go test -v ./...

      - name: Test Race Detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -race ./...

      - name: Build Examples
        run: go build ./examples/...
